<!DOCTYPE html>
<html>
<head>
    <title>Tile ID Annotator - AllOut Legends</title>
    <style>
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: monospace;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .tileset-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .tileset-btn {
            background: #2a2a3e;
            border: 2px solid #4a4a6a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.2s;
        }
        
        .tileset-btn:hover {
            background: #3a3a4e;
            transform: translateY(-2px);
        }
        
        .tileset-btn.active {
            background: #667eea;
            border-color: #667eea;
        }
        
        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.2s;
        }
        
        button:hover {
            transform: scale(1.02);
            background: #45a049;
        }
        
        .download-btn {
            background: #2196f3;
        }
        
        .download-btn:hover {
            background: #0b7dda;
        }
        
        .canvas-container {
            background: #0f0f1a;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            margin-top: 20px;
        }
        
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: #2a2a3e;
            margin: 0 auto;
            display: block;
        }
        
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a3e;
            border-radius: 8px;
            text-align: left;
            font-size: 12px;
        }
        
        .info p {
            margin: 5px 0;
        }
        
        .status {
            margin: 20px;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }
        
        .status.success {
            background: #1a3a1a;
            color: #4caf50;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #fff;
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .font-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #2a2a3e;
            padding: 5px 15px;
            border-radius: 8px;
        }
        
        .font-control input {
            width: 60px;
            background: #1a1a2e;
            border: 1px solid #4a4a6a;
            color: #fff;
            padding: 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Tile ID Annotator</h1>
        <div class="subtitle">Generate annotated tileset images with tile IDs overlaid on each tile</div>
        
        <div class="tileset-selector" id="tileset-selector"></div>
        
        <div class="controls">
            <div class="font-control">
                <span>🔤 Font Size:</span>
                <input type="number" id="fontSize" min="8" max="24" value="12" step="1">
            </div>
            <div class="font-control">
                <span>🎨 Text Color:</span>
                <input type="color" id="textColor" value="#ffffff">
            </div>
            <div class="font-control">
                <span>⬛ Text BG:</span>
                <input type="color" id="bgColor" value="#000000aa">
            </div>
            <button id="generateBtn">✨ Generate Annotated Image</button>
            <button id="downloadBtn" class="download-btn" style="display:none;">💾 Download Image</button>
        </div>
        
        <div id="status"></div>
        
        <div class="canvas-container" id="canvas-container" style="display:none;">
            <canvas id="annotatedCanvas"></canvas>
        </div>
        
        <div class="info" id="info"></div>
    </div>

    <script>
        // Tile data from your TSX files
        const tilesets = [
            { id: "crops", name: "Crops", startId: 0, endId: 24, image: "/assets/tiles/Crops.png", columns: 5, rows: 5, tileWidth: 32, tileHeight: 32 },
            { id: "ground", name: "Ground Terrain", startId: 88, endId: 227, image: "/assets/tiles/ground.png", columns: 20, rows: 7, tileWidth: 32, tileHeight: 32 },
            { id: "houses-snow", name: "Houses Snow", startId: 228, endId: 395, image: "/assets/tiles/houses-snow.png", columns: 21, rows: 8, tileWidth: 32, tileHeight: 32 },
            { id: "houses", name: "Houses", startId: 396, endId: 720, image: "/assets/tiles/houses.png", columns: 25, rows: 13, tileWidth: 32, tileHeight: 32 },
            { id: "rock-snow", name: "Rock Snow", startId: 721, endId: 752, image: "/assets/tiles/rock-snow.png", columns: 8, rows: 4, tileWidth: 32, tileHeight: 32 },
            { id: "rocks", name: "Rocks", startId: 753, endId: 856, image: "/assets/tiles/rocks.png", columns: 8, rows: 13, tileWidth: 32, tileHeight: 32 },
            { id: "trees-snow", name: "Trees Snow", startId: 857, endId: 926, image: "/assets/tiles/trees-snow.png", columns: 10, rows: 7, tileWidth: 32, tileHeight: 32 },
            { id: "trees", name: "Trees", startId: 927, endId: 1070, image: "/assets/tiles/trees4.png", columns: 8, rows: 18, tileWidth: 32, tileHeight: 32 },
            { id: "plants", name: "Plants", startId: 1081, endId: 1105, image: "/assets/tiles/Plants.png", columns: 5, rows: 5, tileWidth: 32, tileHeight: 32 },
            { id: "grassGym", name: "Grass Gym", startId: 301, endId: 340, image: "/assets/tiles/grass-gym.png", columns: 8, rows: 5, tileWidth: 68, tileHeight: 68, atlasWidth: 544, atlasHeight: 340 }
        ];

        let currentTileset = null;
        let originalImage = null;
        let annotatedImageData = null;

        // Create tileset selector buttons
        function createSelector() {
            const container = document.getElementById('tileset-selector');
            tilesets.forEach(tileset => {
                const btn = document.createElement('button');
                btn.className = 'tileset-btn';
                btn.textContent = `${tileset.name} (${tileset.startId}-${tileset.endId})`;
                btn.onclick = () => {
                    document.querySelectorAll('.tileset-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTileset = tileset;
                    loadImage();
                };
                container.appendChild(btn);
            });
            
            // Select first by default
            if (tilesets.length) {
                document.querySelector('.tileset-btn').classList.add('active');
                currentTileset = tilesets[0];
                loadImage();
            }
        }
        
        // Load the tileset image
        function loadImage() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status">📥 Loading image... <div class="loading"></div></div>';
            document.getElementById('canvas-container').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';
            
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                originalImage = img;
                statusDiv.innerHTML = '<div class="status success">✅ Image loaded successfully!</div>';
                generateAnnotatedImage();
            };
            img.onerror = () => {
                statusDiv.innerHTML = `<div class="status error">❌ Failed to load: ${currentTileset.image}</div>`;
                console.error('Failed to load image:', currentTileset.image);
            };
            img.src = currentTileset.image;
        }
        
        // Generate annotated image with IDs on each tile
        function generateAnnotatedImage() {
            if (!originalImage) return;
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status">🎨 Generating annotated image... <div class="loading"></div></div>';
            
            const fontSize = parseInt(document.getElementById('fontSize').value);
            const textColor = document.getElementById('textColor').value;
            const bgColorRaw = document.getElementById('bgColor').value;
            
            // Parse background color with alpha
            let bgColor = bgColorRaw;
            if (bgColorRaw === '#000000aa') {
                bgColor = 'rgba(0,0,0,0.7)';
            } else {
                // Convert hex to rgba
                const r = parseInt(bgColorRaw.slice(1,3), 16);
                const g = parseInt(bgColorRaw.slice(3,5), 16);
                const b = parseInt(bgColorRaw.slice(5,7), 16);
                bgColor = `rgba(${r},${g},${b},0.7)`;
            }
            
            // Create canvas
            const canvas = document.getElementById('annotatedCanvas');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size to match image
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            
            // Draw original image
            ctx.drawImage(originalImage, 0, 0);
            
            // Calculate tile dimensions
            const tileW = currentTileset.tileWidth;
            const tileH = currentTileset.tileHeight;
            const cols = currentTileset.columns;
            
            // Font settings
            ctx.font = `bold ${fontSize}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Draw ID on each tile
            let drawnCount = 0;
            
            for (let id = currentTileset.startId; id <= currentTileset.endId; id++) {
                const localId = id - currentTileset.startId;
                const col = localId % cols;
                const row = Math.floor(localId / cols);
                
                const tileX = col * tileW;
                const tileY = row * tileH;
                const centerX = tileX + tileW / 2;
                const centerY = tileY + tileH / 2;
                
                // Draw background for text
                ctx.fillStyle = bgColor;
                const textWidth = ctx.measureText(id.toString()).width;
                ctx.fillRect(centerX - textWidth/2 - 4, centerY - fontSize/2 - 2, textWidth + 8, fontSize + 4);
                
                // Draw ID text
                ctx.fillStyle = textColor;
                ctx.fillText(id.toString(), centerX, centerY);
                
                drawnCount++;
            }
            
            // Store image data for download
            annotatedImageData = canvas.toDataURL('image/png');
            
            statusDiv.innerHTML = `<div class="status success">✅ Annotated ${drawnCount} tiles!</div>`;
            document.getElementById('canvas-container').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'inline-block';
            
            // Update info
            const infoDiv = document.getElementById('info');
            infoDiv.innerHTML = `
                <p><strong>📊 Tileset Info:</strong></p>
                <p>• Name: ${currentTileset.name}</p>
                <p>• Image: ${currentTileset.image}</p>
                <p>• Grid: ${currentTileset.columns} × ${currentTileset.rows}</p>
                <p>• Tile Size: ${tileW}×${tileH}px</p>
                <p>• Image Size: ${originalImage.width}×${originalImage.height}px</p>
                <p>• Tile IDs: ${currentTileset.startId} → ${currentTileset.endId}</p>
                <p>• Total Tiles: ${drawnCount}</p>
                <p><strong>💡 Tip:</strong> Hover over the image and right-click to save, or use the Download button below.</p>
            `;
        }
        
        // Download the annotated image
        function downloadImage() {
            if (!annotatedImageData) return;
            
            const link = document.createElement('a');
            link.download = `${currentTileset.id}_annotated.png`;
            link.href = annotatedImageData;
            link.click();
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status success">✅ Downloaded ${currentTileset.name}_annotated.png</div>`;
            setTimeout(() => {
                if (statusDiv.innerHTML.includes('Downloaded')) {
                    statusDiv.innerHTML = '';
                }
            }, 3000);
        }
        
        // Event listeners
        document.getElementById('generateBtn').addEventListener('click', () => {
            if (originalImage) {
                generateAnnotatedImage();
            } else {
                loadImage();
            }
        });
        
        document.getElementById('downloadBtn').addEventListener('click', downloadImage);
        
        // Reload when font settings change
        document.getElementById('fontSize').addEventListener('change', () => {
            if (originalImage) generateAnnotatedImage();
        });
        document.getElementById('textColor').addEventListener('change', () => {
            if (originalImage) generateAnnotatedImage();
        });
        document.getElementById('bgColor').addEventListener('change', () => {
            if (originalImage) generateAnnotatedImage();
        });
        
        // Initialize
        createSelector();
    </script>
</body>
</html>
