<!DOCTYPE html>
<html>
<head>
    <title>AllOut Legends - Tile ID Reference</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #fff;
            padding: 20px;
            margin: 0;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 12px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .search-box {
            padding: 10px 15px;
            font-size: 14px;
            border: 2px solid #4a4a6a;
            border-radius: 8px;
            background: #2a2a3e;
            color: #fff;
            width: 250px;
            font-family: monospace;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2a2a3e;
            color: #fff;
            transition: all 0.2s;
            font-family: monospace;
            font-size: 12px;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        
        .filter-btn:hover {
            transform: translateY(-2px);
        }
        
        .stats {
            text-align: center;
            margin-bottom: 20px;
            padding: 12px;
            background: #2a2a3e;
            border-radius: 8px;
            font-size: 13px;
        }
        
        .stats span {
            color: #4caf50;
            font-weight: bold;
        }
        
        .tileset {
            margin-bottom: 30px;
            background: #0f0f1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a3e;
        }
        
        .tileset-header {
            background: linear-gradient(135deg, #2a2a3e 0%, #1a1a2e 100%);
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .tileset-header h2 {
            margin: 0;
            color: #4caf50;
            font-size: 18px;
        }
        
        .tileset-info {
            display: flex;
            gap: 20px;
            font-size: 11px;
            color: #aaa;
            flex-wrap: wrap;
        }
        
        .tileset-info span {
            color: #fff;
        }
        
        .toggle-icon {
            font-size: 18px;
            transition: transform 0.3s;
        }
        
        .tileset-content {
            padding: 20px;
            display: none;
        }
        
        .tileset-content.open {
            display: block;
        }
        
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 85px));
            gap: 12px;
            justify-content: center;
        }
        
        .tile-item {
            text-align: center;
            padding: 8px;
            background: #1a1a2e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .tile-item:hover {
            transform: translateY(-3px);
            background: #3a3a4e;
            border-color: #667eea;
        }
        
        .tile-preview {
            width: 64px;
            height: 64px;
            margin: 0 auto;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #2a2a3e;
        }
        
        .tile-id {
            margin-top: 6px;
            font-size: 11px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .walkable {
            color: #4caf50;
            font-size: 9px;
            margin-top: 4px;
        }
        
        .blocked {
            color: #f44336;
            font-size: 9px;
            margin-top: 4px;
        }
        
        .copy-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            animation: fadeOut 2s ease forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-20px); visibility: hidden; }
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .image-error {
            background: #3a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #f44336;
        }
        
        @media (max-width: 768px) {
            .tile-grid {
                grid-template-columns: repeat(auto-fill, minmax(75px, 75px));
                gap: 8px;
            }
            
            .tile-preview {
                width: 48px;
                height: 48px;
            }
            
            .tileset-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4a4a6a;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }
    </style>
</head>
<body>
    <h1>🎨 AllOut Legends - Tile ID Reference</h1>
    <div class="subtitle">Click any tile to copy its ID | Use in paint mode with Tile ID input</div>
    
    <div class="controls">
        <input type="text" class="search-box" id="search" placeholder="🔍 Search by ID...">
        <div class="filter-buttons" id="filter-buttons">
            <button class="filter-btn active" data-filter="all">All Tilesets</button>
        </div>
    </div>
    
    <div class="stats" id="stats">Loading tiles...</div>
    <div id="tilesets"></div>

    <script>
        // Accurate tile data from your masterTileset configuration
        // Based on actual TSX file dimensions
        const tilesets = [
            { id: "crops", name: "Crops", startId: 0, endId: 24, walkable: false, image: "/assets/tiles/Crops.png", columns: 5, rows: 5, tileWidth: 32, tileHeight: 32 },
            { id: "ground", name: "Ground Terrain", startId: 88, endId: 227, walkable: true, image: "/assets/tiles/ground.png", columns: 20, rows: 7, tileWidth: 32, tileHeight: 32 },
            { id: "houses-snow", name: "Houses Snow", startId: 228, endId: 395, walkable: false, image: "/assets/tiles/houses-snow.png", columns: 21, rows: 8, tileWidth: 32, tileHeight: 32 },
            { id: "houses", name: "Houses", startId: 396, endId: 720, walkable: false, image: "/assets/tiles/houses.png", columns: 25, rows: 13, tileWidth: 32, tileHeight: 32 },
            { id: "rock-snow", name: "Rock Snow", startId: 721, endId: 752, walkable: false, image: "/assets/tiles/rock-snow.png", columns: 8, rows: 4, tileWidth: 32, tileHeight: 32 },
            { id: "rocks", name: "Rocks", startId: 753, endId: 856, walkable: false, image: "/assets/tiles/rocks.png", columns: 8, rows: 13, tileWidth: 32, tileHeight: 32 },
            { id: "trees-snow", name: "Trees Snow", startId: 857, endId: 926, walkable: false, image: "/assets/tiles/trees-snow.png", columns: 10, rows: 7, tileWidth: 32, tileHeight: 32 },
            { id: "trees", name: "Trees", startId: 927, endId: 1070, walkable: false, image: "/assets/tiles/trees4.png", columns: 8, rows: 18, tileWidth: 32, tileHeight: 32 },
            { id: "plants", name: "Plants", startId: 1081, endId: 1105, walkable: false, image: "/assets/tiles/Plants.png", columns: 5, rows: 5, tileWidth: 32, tileHeight: 32 },
            { id: "grassGym", name: "Grass Gym", startId: 301, endId: 340, walkable: false, image: "/assets/tiles/grass-gym.png", columns: 8, rows: 5, tileWidth: 68, tileHeight: 68, atlasWidth: 544, atlasHeight: 340 }
        ];

        let currentFilter = "all";
        
        // Calculate exact tile position based on actual grid dimensions
        function getTilePosition(tileId, tileset) {
            const localId = tileId - tileset.startId;
            const col = localId % tileset.columns;
            const row = Math.floor(localId / tileset.columns);
            return { x: col * tileset.tileWidth, y: row * tileset.tileHeight };
        }
        
        // Calculate total atlas size for background-size
        function getAtlasSize(tileset) {
            const totalWidth = tileset.atlasWidth ?? (tileset.columns * tileset.tileWidth);
            const totalHeight = tileset.atlasHeight ?? (tileset.rows * tileset.tileHeight);
            return { width: totalWidth, height: totalHeight };
        }
        
        // Show toast notification
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'copy-toast';
            toast.textContent = message;
            toast.style.background = isError ? '#f44336' : '#4caf50';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        // Copy to clipboard
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(`✅ Copied Tile ID: ${text}`);
            } catch (err) {
                showToast(`❌ Failed to copy: ${text}`, true);
            }
        }
        
        // Handle image load error
        function handleImageError(imgElement, tileId, tileset) {
            console.warn(`Failed to load image for tile ${tileId}: ${tileset.image}`);
            imgElement.style.background = '#3a1a1a';
            imgElement.style.display = 'flex';
            imgElement.style.alignItems = 'center';
            imgElement.style.justifyContent = 'center';
            imgElement.innerHTML = `<span style="font-size:10px; color:#f44336;">${tileId}</span>`;
            imgElement.classList.add('image-error');
        }
        
        // Create filter buttons dynamically
        function createFilterButtons() {
            const container = document.getElementById('filter-buttons');
            const uniqueTilesets = [...new Set(tilesets.map(t => t.id))];
            
            uniqueTilesets.forEach(tilesetId => {
                const tileset = tilesets.find(t => t.id === tilesetId);
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = tileset.name;
                btn.dataset.filter = tilesetId;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = tilesetId;
                    renderTilesets();
                };
                container.appendChild(btn);
            });
        }
        
        function renderTilesets() {
            const container = document.getElementById('tilesets');
            const searchTerm = document.getElementById('search').value.toLowerCase();
            
            container.innerHTML = '';
            let totalVisibleTiles = 0;
            let totalTiles = 0;
            
            const filteredTilesets = currentFilter === 'all' 
                ? tilesets 
                : tilesets.filter(t => t.id === currentFilter);
            
            filteredTilesets.forEach(tileset => {
                const tileCount = tileset.endId - tileset.startId + 1;
                const atlasSize = getAtlasSize(tileset);
                totalTiles += tileCount;
                
                const tilesetDiv = document.createElement('div');
                tilesetDiv.className = 'tileset';
                tilesetDiv.innerHTML = `
                    <div class="tileset-header" data-tileset="${tileset.id}">
                        <div>
                            <h2>📦 ${tileset.name}</h2>
                            <div class="tileset-info">
                                <span>IDs: ${tileset.startId} → ${tileset.endId}</span>
                                <span>Tiles: ${tileCount}</span>
                                <span>Grid: ${tileset.columns}×${tileset.rows}</span>
                                <span>Size: ${tileset.tileWidth}×${tileset.tileHeight}px</span>
                            </div>
                        </div>
                        <div>
                            <span class="toggle-icon">▼</span>
                        </div>
                    </div>
                    <div class="tileset-content" id="content-${tileset.id}">
                        <div class="tile-grid" id="grid-${tileset.id}"></div>
                    </div>
                `;
                container.appendChild(tilesetDiv);
                
                // Toggle functionality
                const header = tilesetDiv.querySelector('.tileset-header');
                const content = tilesetDiv.querySelector('.tileset-content');
                header.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'BUTTON' && !e.target.closest('.filter-btn')) {
                        content.classList.toggle('open');
                        const icon = header.querySelector('.toggle-icon');
                        icon.textContent = content.classList.contains('open') ? '▲' : '▼';
                    }
                });
                content.classList.add('open');
                
                const grid = document.getElementById(`grid-${tileset.id}`);
                let visibleInTileset = 0;
                
                for (let id = tileset.startId; id <= tileset.endId; id++) {
                    if (searchTerm && !id.toString().includes(searchTerm)) continue;
                    
                    visibleInTileset++;
                    const pos = getTilePosition(id, tileset);
                    
                    const tileDiv = document.createElement('div');
                    tileDiv.className = 'tile-item';
                    tileDiv.onclick = (e) => {
                        e.stopPropagation();
                        copyToClipboard(id.toString());
                    };
                    
                    const previewDiv = document.createElement('div');
                    previewDiv.className = 'tile-preview';
                    previewDiv.style.backgroundImage = `url('${tileset.image}')`;
                    previewDiv.style.backgroundPosition = `-${pos.x}px -${pos.y}px`;
                    previewDiv.style.backgroundSize = `${atlasSize.width}px ${atlasSize.height}px`;
                    previewDiv.style.width = '64px';
                    previewDiv.style.height = '64px';
                    
                    // Handle image load error
                    const imgTest = new Image();
                    imgTest.onload = () => {};
                    imgTest.onerror = () => {
                        handleImageError(previewDiv, id, tileset);
                    };
                    imgTest.src = tileset.image;
                    
                    tileDiv.appendChild(previewDiv);
                    
                    const idSpan = document.createElement('div');
                    idSpan.className = 'tile-id';
                    idSpan.textContent = `ID: ${id}`;
                    tileDiv.appendChild(idSpan);
                    
                    const walkableSpan = document.createElement('div');
                    walkableSpan.className = tileset.walkable ? 'walkable' : 'blocked';
                    walkableSpan.textContent = tileset.walkable ? '🚶 Walkable' : '🚫 Blocked';
                    tileDiv.appendChild(walkableSpan);
                    
                    grid.appendChild(tileDiv);
                }
                
                totalVisibleTiles += visibleInTileset;
                
                if (visibleInTileset === 0) {
                    grid.innerHTML = '<div class="no-results">No matching tiles in this tileset</div>';
                }
            });
            
            document.getElementById('stats').innerHTML = `
                📊 Showing ${totalVisibleTiles} of ${totalTiles} tiles | 
                📁 ${filteredTilesets.length} tilesets | 
                💡 Click any tile to copy its ID
            `;
        }
        
        // Initialize
        createFilterButtons();
        renderTilesets();
        
        // Search handler
        document.getElementById('search').addEventListener('input', renderTilesets);
        
        console.log('Tile ID Reference loaded! Click any tile to copy its ID.');
    </script>
</body>
</html>
